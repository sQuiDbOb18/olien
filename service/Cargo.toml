[package]
name = "olien-service"
version = "0.1.0"
edition = "2021"
description = "The Olien treasury service: indexes Olien accounts into Postgres, serves the console's API, relays executions, and runs payroll, cheques, API keys and webhooks."

[dependencies]
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "macros", "migrate"] }
alloy = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
sha2 = "0.10"
# P-256 checks for passkey members, done here exactly as OlienVerifier does them on
# chain, so a signature the service accepts is one the contract will also accept.
p256 = { version = "0.13", features = ["ecdsa"] }
